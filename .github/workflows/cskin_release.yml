name: Create Release (cskin)

on:
  push:
    tags:
      - "anymore-hamster-*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commits between tags
        id: commits
        run: |
          CURRENT_TAG="${{ github.ref_name }}"

          # 按创建时间倒序取上一个正式版标签（后缀可以是时间戳或文字描述）
          PREV_TAG=$(git tag --list "anymore-hamster-*" --sort=-creatordate \
            | grep -vxF "$CURRENT_TAG" \
            | grep -Ev -- "-(rc|beta|alpha)([.-]|[0-9]|$)" \
            | head -n 1 || true)

          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

          if [ -n "$PREV_TAG" ]; then
            commits=$(git log --pretty=format:'- %s' "$PREV_TAG"..HEAD | sed 's/[^[:print:]]//g')
          else
            commits=$(git log --pretty=format:'- %s' HEAD | sed 's/[^[:print:]]//g')
          fi
          echo "commits<<EOF" >> "$GITHUB_OUTPUT"
          echo "$commits" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Package cskin files
        id: package
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ github.ref_name }}"
          # 发版附件统一前缀
          PREFIX="anymore-hamster"
          mkdir -p release
          files=()

          if [ -d "Skin_Keyboard/万象-元书/wanxiang" ]; then
            printf '%s\n' "$CURRENT_TAG" > "Skin_Keyboard/万象-元书/wanxiang/version.txt"
            (cd "Skin_Keyboard/万象-元书" && zip -r "../../release/${PREFIX}-wanxiang.zip" "wanxiang")
            files+=("release/${PREFIX}-wanxiang.zip")
          else
            echo "Skipping: Skin_Keyboard/万象-元书/wanxiang not found"
          fi

          if [ -d "Skin_Keyboard/万象-元书/WanxiangSkin" ]; then
            printf '%s\n' "$CURRENT_TAG" > "Skin_Keyboard/万象-元书/WanxiangSkin/version.txt"
            (cd "Skin_Keyboard/万象-元书" && zip -r "../../release/${PREFIX}-WanxiangSkin.zip" "WanxiangSkin")
            mv "release/${PREFIX}-WanxiangSkin.zip" "release/${PREFIX}-WanxiangSkin.cskin"
            files+=("release/${PREFIX}-WanxiangSkin.cskin")
          else
            echo "Skipping: Skin_Keyboard/万象-元书/WanxiangSkin not found"
          fi

          if [ -d "Skin_Keyboard/万象-元书/WanxiangSkin-Android" ]; then
            printf '%s\n' "$CURRENT_TAG" > "Skin_Keyboard/万象-元书/WanxiangSkin-Android/version.txt"
            (cd "Skin_Keyboard/万象-元书" && zip -r "../../release/${PREFIX}-WanxiangSkin-Android.zip" "WanxiangSkin-Android")
            mv "release/${PREFIX}-WanxiangSkin-Android.zip" "release/${PREFIX}-WanxiangSkin-Android.cskin"
            files+=("release/${PREFIX}-WanxiangSkin-Android.cskin")
          else
            echo "Skipping: Skin_Keyboard/万象-元书/WanxiangSkin-Android not found"
          fi

          if [ -d "Skin_Keyboard/万象-元书/wanxiang-modifier" ]; then
            (cd "Skin_Keyboard/万象-元书" && zip -r "../../release/${PREFIX}-wanxiang-modifier.zip" "wanxiang-modifier")
            files+=("release/${PREFIX}-wanxiang-modifier.zip")
          else
            echo "Skipping: Skin_Keyboard/万象-元书/wanxiang-modifier not found"
          fi

          if [ -d "Skin_Keyboard/万象-元书/WanxiangSkin-modifier" ]; then
            (cd "Skin_Keyboard/万象-元书" && zip -r "../../release/${PREFIX}-WanxiangSkin-modifier.zip" "WanxiangSkin-modifier")
            files+=("release/${PREFIX}-WanxiangSkin-modifier.zip")
          else
            echo "Skipping: Skin_Keyboard/万象-元书/WanxiangSkin-modifier not found"
          fi

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No cskin files produced. Aborting release."
            exit 1
          fi

          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${files[@]}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Changes since ${{ steps.commits.outputs.prev_tag }}:
            ${{ steps.commits.outputs.commits }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: ${{ steps.package.outputs.files }}